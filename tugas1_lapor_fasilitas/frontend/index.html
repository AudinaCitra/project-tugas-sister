<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapor Fasilitas Rusak</title>
<script src="/config.js"></script>
<style>
  :root { --tinta:#1d2a33; --biru:#175d8f; --latar:#f4f6f8; --garis:#d6dde3; --merah:#b3261e; --hijau:#1f7a4d; --kuning:#9a6700; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--latar); color:var(--tinta); line-height:1.5; }
  main { max-width: 820px; margin:0 auto; padding: 20px 16px 70px; }
  h1 { margin:8px 0 2px; font-size:1.6rem; }
  p.sub { margin:0 0 16px; color:#566673; }
  nav { display:flex; gap:6px; margin-bottom:14px; }
  nav button { flex:1; background:#fff; color:var(--tinta); border:1px solid var(--garis); }
  nav button.aktif { background:var(--biru); color:#fff; border-color:var(--biru); }
  section, .kartu { background:#fff; border:1px solid var(--garis); border-radius:10px; padding:16px; margin-bottom:14px; }
  h2 { margin:0 0 10px; font-size:1.1rem; }
  label { display:block; font-weight:600; font-size:.9rem; margin:10px 0 4px; }
  input, select, textarea, button { font:inherit; padding:9px 11px; border-radius:8px; border:1px solid var(--garis); }
  input, select, textarea { width:100%; background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  button { background:var(--biru); color:#fff; border:none; cursor:pointer; }
  button.abu { background:#e8edf1; color:var(--tinta); }
  button.merah { background:none; color:var(--merah); }
  button:disabled { opacity:.6; cursor:wait; }
  :focus-visible { outline:3px solid #9cc7e6; outline-offset:1px; }
  .dua { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .baris { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #pesan { min-height:1.4em; margin-bottom:8px; font-weight:600; }
  .ok { color:var(--hijau); } .err { color:var(--merah); }
  .lencana { display:inline-block; padding:1px 9px; border-radius:11px; font-size:.82rem; font-weight:600; background:#e8edf1; }
  .Baru { background:#fde7e5; color:var(--merah); } .Diproses { background:#fff1cc; color:var(--kuning); } .Selesai { background:#dff3e8; color:var(--hijau); }
  .Tinggi { border-left:5px solid var(--merah); } .Sedang { border-left:5px solid #d9a400; } .Rendah { border-left:5px solid #7a8a96; }
  .kartu h3 { margin:0 0 4px; font-size:1rem; }
  .meta { color:#566673; font-size:.88rem; }
  .garis-waktu { margin:10px 0 0; padding-left:16px; border-left:2px solid var(--garis); }
  .garis-waktu li { list-style:none; margin-bottom:8px; font-size:.9rem; }
  .stat { display:grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap:10px; }
  .stat div { background:var(--latar); border-radius:8px; padding:10px; }
  .stat b { display:block; font-size:1.4rem; }
  [hidden] { display:none !important; }
  @media (max-width:520px) { .dua { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1>Lapor Fasilitas Rusak</h1>
  <p class="sub">Laporkan lampu mati, keran bocor, atau AC rusak. Pantau statusnya sampai selesai.</p>
  <div id="pesan" role="status"></div>

  <nav>
    <button id="tabPenghuni" class="aktif" onclick="pilihTab('penghuni')">Penghuni</button>
    <button id="tabPetugas" onclick="pilihTab('petugas')">Petugas</button>
  </nav>

  <!-- ================= PENGHUNI ================= -->
  <div id="halPenghuni">
    <section>
      <h2>Buat laporan</h2>
      <div class="dua">
        <div><label for="pelapor">Nama kamu</label><input id="pelapor" maxlength="60"></div>
        <div><label for="lokasi">Lokasi</label><input id="lokasi" maxlength="80" placeholder="Contoh: Kamar mandi lantai 2"></div>
        <div><label for="kategori">Kategori</label><select id="kategori"></select></div>
        <div><label for="prioritas">Prioritas</label><select id="prioritas"></select></div>
      </div>
      <label for="deskripsi">Apa yang rusak?</label>
      <textarea id="deskripsi" maxlength="500" placeholder="Jelaskan kerusakannya"></textarea>
      <div class="baris" style="margin-top:10px"><button id="kirim" onclick="kirimLaporan()">Kirim laporan</button></div>
    </section>

    <section>
      <h2>Daftar laporan</h2>
      <div class="baris" style="margin-bottom:10px">
        <select id="filterStatus" onchange="muatLaporan()" style="width:auto" aria-label="Filter status"></select>
        <select id="filterKategori" onchange="muatLaporan()" style="width:auto" aria-label="Filter kategori"></select>
      </div>
      <div id="daftar"></div>
    </section>
  </div>

  <!-- ================= PETUGAS ================= -->
  <div id="halPetugas" hidden>
    <section id="formMasuk">
      <h2>Masuk sebagai petugas</h2>
      <label for="pin">PIN petugas</label>
      <input id="pin" type="password" autocomplete="off">
      <div class="baris" style="margin-top:10px"><button onclick="masukPetugas()">Masuk</button></div>
    </section>

    <div id="areaPetugas" hidden>
      <section>
        <h2>Ringkasan</h2>
        <div class="stat" id="stat"></div>
      </section>
      <section>
        <h2>Kelola laporan</h2>
        <div id="daftarPetugas"></div>
      </section>
    </div>
  </div>
</main>

<script>
const API = window.API_URL || "http://127.0.0.1:5000";
let pinPetugas = "";   // disimpan di memori saja

const el = id => document.getElementById(id);
function pesan(teks, error = false) { el("pesan").textContent = teks; el("pesan").className = error ? "err" : "ok"; }
function waktu(s) { return s ? new Date(s.replace(" ", "T") + "Z").toLocaleString("id-ID", {dateStyle:"medium", timeStyle:"short"}) : "-"; }

async function panggil(path, method = "GET", body = null, petugas = false) {
  const headers = {"Content-Type": "application/json"};
  if (petugas) headers["X-Petugas-Pin"] = pinPetugas;
  try {
    const res = await fetch(API + path, {method, headers, body: body ? JSON.stringify(body) : null});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Terjadi kesalahan");
    return data;
  } catch (e) {
    pesan(e.message === "Failed to fetch" ? "Back end tidak bisa dihubungi. Pastikan Aplikasi A sudah jalan." : e.message, true);
    return null;
  }
}

function isiSelect(id, daftar, semua) {
  el(id).innerHTML = (semua ? `<option value="">${semua}</option>` : "") + daftar.map(x => `<option>${x}</option>`).join("");
}

async function mulai() {
  const o = await panggil("/opsi");
  if (!o) return;
  isiSelect("kategori", o.kategori);
  isiSelect("prioritas", o.prioritas); el("prioritas").value = "Sedang";
  isiSelect("filterStatus", o.status, "Semua status");
  isiSelect("filterKategori", o.kategori, "Semua kategori");
  window.OPSI = o;
  muatLaporan();
}

function pilihTab(nama) {
  const p = nama === "penghuni";
  el("halPenghuni").hidden = !p; el("halPetugas").hidden = p;
  el("tabPenghuni").className = p ? "aktif" : ""; el("tabPetugas").className = p ? "" : "aktif";
  pesan("");
  if (p) muatLaporan(); else if (pinPetugas) muatPetugas();
}

async function kirimLaporan() {
  el("kirim").disabled = true;
  const r = await panggil("/laporan", "POST", {
    pelapor: el("pelapor").value, lokasi: el("lokasi").value, kategori: el("kategori").value,
    prioritas: el("prioritas").value, deskripsi: el("deskripsi").value
  });
  el("kirim").disabled = false;
  if (r) { pesan("Laporan terkirim. Nomor laporan: #" + r.id); el("deskripsi").value = ""; muatLaporan(); }
}

function kartu(l, petugas) {
  const d = document.createElement("div");
  d.className = "kartu " + l.prioritas;
  d.innerHTML = `<h3></h3><div class="meta"></div><p style="margin:6px 0"></p><div class="baris"></div><div class="rinci"></div>`;
  d.querySelector("h3").textContent = `#${l.id} ${l.kategori} - ${l.lokasi}`;
  d.querySelector(".meta").textContent = `Dilapor ${l.pelapor} | ${waktu(l.dibuat)} | Prioritas ${l.prioritas}`;
  d.querySelector("p").textContent = l.deskripsi;
  const baris = d.querySelector(".baris");
  baris.innerHTML = `<span class="lencana ${l.status}">${l.status}</span>`;

  const tombol = document.createElement("button");
  tombol.className = "abu"; tombol.textContent = "Lihat riwayat";
  tombol.onclick = () => bukaRiwayat(l.id, d.querySelector(".rinci"));
  baris.appendChild(tombol);

  if (petugas) {
    const sel = document.createElement("select"); sel.style.width = "auto"; sel.setAttribute("aria-label", "Status baru");
    sel.innerHTML = window.OPSI.status.map(s => `<option ${s === l.status ? "selected" : ""}>${s}</option>`).join("");
    const cat = document.createElement("input"); cat.placeholder = "Catatan (opsional)"; cat.style.width = "180px";
    const simpan = document.createElement("button"); simpan.textContent = "Simpan";
    simpan.onclick = async () => {
      const r = await panggil(`/laporan/${l.id}/status`, "PATCH", {status: sel.value, catatan: cat.value}, true);
      if (r) { pesan(r.pesan); muatPetugas(); }
    };
    const hapus = document.createElement("button"); hapus.className = "merah"; hapus.textContent = "Hapus";
    hapus.onclick = async () => {
      if (!confirm("Hapus laporan #" + l.id + "?")) return;
      const r = await panggil(`/laporan/${l.id}`, "DELETE", null, true);
      if (r) { pesan(r.pesan); muatPetugas(); }
    };
    baris.append(sel, cat, simpan, hapus);
  }
  return d;
}

async function bukaRiwayat(id, wadah) {
  if (wadah.innerHTML) { wadah.innerHTML = ""; return; }
  const d = await panggil("/laporan/" + id);
  if (!d) return;
  const ul = document.createElement("ul"); ul.className = "garis-waktu";
  d.riwayat.forEach(r => {
    const li = document.createElement("li");
    li.innerHTML = `<b></b> <span class="meta"></span><br><span></span>`;
    li.querySelector("b").textContent = r.status;
    li.querySelector(".meta").textContent = waktu(r.waktu);
    li.lastChild.textContent = r.catatan || "";
    ul.appendChild(li);
  });
  wadah.appendChild(ul);
}

async function muatLaporan() {
  const q = new URLSearchParams();
  if (el("filterStatus").value) q.set("status", el("filterStatus").value);
  if (el("filterKategori").value) q.set("kategori", el("filterKategori").value);
  const data = await panggil("/laporan?" + q);
  if (!data) return;
  el("daftar").innerHTML = data.length ? "" : "<p>Belum ada laporan. Buat laporan pertama di atas.</p>";
  data.forEach(l => el("daftar").appendChild(kartu(l, false)));
}

async function masukPetugas() {
  pinPetugas = el("pin").value;
  const r = await panggil("/petugas/cek", "GET", null, true);
  if (!r) { pinPetugas = ""; return; }
  el("formMasuk").hidden = true; el("areaPetugas").hidden = false;
  pesan("Berhasil masuk sebagai petugas."); muatPetugas();
}

async function muatPetugas() {
  const s = await panggil("/statistik");
  if (s) {
    el("stat").innerHTML = `
      <div><b>${s.total}</b>Total laporan</div>
      <div><b>${s.per_status.Baru}</b>Baru</div>
      <div><b>${s.per_status.Diproses}</b>Diproses</div>
      <div><b>${s.per_status.Selesai}</b>Selesai</div>
      <div><b>${s.rata_jam_selesai ?? "-"}</b>Rata-rata jam selesai</div>`;
  }
  const data = await panggil("/laporan");
  if (!data) return;
  el("daftarPetugas").innerHTML = data.length ? "" : "<p>Belum ada laporan masuk.</p>";
  data.forEach(l => el("daftarPetugas").appendChild(kartu(l, true)));
}

mulai();
</script>
</body>
</html>
